[project]
name = "SubQCAT"
version = "0.1.0"
description = "Subcellular Quality Control Analysis Tool for spatial transcriptomics data"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Priyal Tripathi" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

# These are the ONLY dependencies a user needs to run SubQCAT
dependencies = [
    "dask>=2026.7.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]

[project.urls]
Homepage = "https://github.com/yourusername/SubQCAT"
Repository = "https://github.com/yourusername/SubQCAT"

# Dev dependencies are only installed by contributors, not end users
[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subqcat"]
